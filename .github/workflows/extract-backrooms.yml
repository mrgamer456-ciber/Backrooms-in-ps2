name: 1 - Extrair Backrooms PS2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extrair ZIP para a pasta source
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)"
          if [ -z "$ZIP" ]; then
            echo "::error::Nenhum ZIP encontrado na raiz do repositorio."
            exit 1
          fi
          mkdir -p source/backrooms-ps2
          unzip -oq "$ZIP" -d /tmp/backrooms-unpack
          MAKEFILE="$(find /tmp/backrooms-unpack -type f -name Makefile -print -quit)"
          if [ -z "$MAKEFILE" ]; then
            echo "::error::O ZIP nao contem Makefile."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$MAKEFILE")"
          cp -a "$PROJECT_DIR"/. source/backrooms-ps2/
          rm -rf source/backrooms-ps2/.git source/backrooms-ps2/.github
          test -f source/backrooms-ps2/Makefile
          echo "Arquivos extraidos:"
          find source/backrooms-ps2 -maxdepth 2 -type f | sort

      - name: Salvar arquivos extraidos no repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/backrooms-ps2
          if git diff --cached --quiet; then
            echo "Os arquivos ja estao extraidos e atualizados."
          else
            git commit -m "Extract Backrooms PS2 source files"
            git push
          fi
