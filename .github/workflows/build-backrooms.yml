name: Extrair e compilar Backrooms PS2

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/build-backrooms.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Localizar e extrair o ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 2 -type f -iname '*.zip' ! -path './.git/*' | head -n 1)"
          if [ -z "$ZIP" ]; then
            echo "::error::Nenhum arquivo ZIP encontrado. Envie backrooms-ps2-v0.3.zip para a raiz do repositorio e execute o workflow novamente."
            exit 1
          fi
          echo "ZIP encontrado: $ZIP"
          mkdir -p extracted
          unzip -q "$ZIP" -d extracted
          MAKEFILE="$(find extracted -type f -name Makefile -print -quit)"
          if [ -z "$MAKEFILE" ]; then
            echo "::error::O ZIP foi extraido, mas nao contem Makefile."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$MAKEFILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projeto encontrado em: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Compilar ELF com audio e texturas
        id: full
        continue-on-error: true
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            -w "/src/$PROJECT_DIR" \
            ps2dev/ps2dev:latest \
            sh -lc 'make clean && make'

      - name: Compilar sem audio (fallback)
        if: steps.full.outcome == 'failure'
        id: no_audio
        continue-on-error: true
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            -w "/src/$PROJECT_DIR" \
            ps2dev/ps2dev:latest \
            sh -lc 'make clean && make USE_AUDIO=0'

      - name: Compilar sem audio e sem textura (ultimo fallback)
        if: steps.full.outcome == 'failure' && steps.no_audio.outcome == 'failure'
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            -w "/src/$PROJECT_DIR" \
            ps2dev/ps2dev:latest \
            sh -lc 'make clean && make USE_AUDIO=0 USE_WALL_TEXTURE=0'

      - name: Validar ELF
        run: |
          ELF="$PROJECT_DIR/backrooms.elf"
          test -s "$ELF" || { echo "::error::O arquivo backrooms.elf nao foi gerado."; exit 1; }
          file "$ELF"
          mkdir -p output
          cp "$ELF" output/backrooms.elf

      - name: Publicar ELF para download
        uses: actions/upload-artifact@v4
        with:
          name: Backrooms-PS2-ELF
          path: output/backrooms.elf
          if-no-files-found: error
          retention-days: 30
