name: 2 - Compilar Backrooms PS2 ELF

on:
  workflow_dispatch:
  push:
    paths:
      - 'source/backrooms-ps2/**'
      - '.github/workflows/build-backrooms.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo extraido
        uses: actions/checkout@v4

      - name: Verificar fontes
        run: |
          test -f source/backrooms-ps2/Makefile
          find source/backrooms-ps2 -maxdepth 2 -type f | sort

      - name: Compilar com PS2SDK
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/source/backrooms-ps2:/src" \
            -w /src \
            ps2dev/ps2dev:latest \
            sh -lc 'apk add --no-cache make gmp mpc1 mpfr4 && make clean && make'

      - name: Verificar ELF
        run: |
          ELF="$(find source/backrooms-ps2 -maxdepth 2 -type f -iname '*.elf' -print -quit)"
          if [ -z "$ELF" ]; then
            echo "::error::A compilacao terminou sem gerar nenhum arquivo ELF."
            exit 1
          fi
          mkdir -p output
          cp "$ELF" output/backrooms.elf
          file output/backrooms.elf

      - name: Disponibilizar ELF
        uses: actions/upload-artifact@v4
        with:
          name: Backrooms-PS2-ELF
          path: output/backrooms.elf
          if-no-files-found: error
          retention-days: 30
